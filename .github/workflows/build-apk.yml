name: INTERCEPT 0.3.1-ux APK

on:
  workflow_dispatch:

env:
  EXPECTED_TEXTSRC_SHA256: 2ce0d2c445f129c96f50f418c3088dc878b2e85dad1ed0c23d74bdef2164ef8e
  TEXTSRC_URL: https://d.uguu.se/ShJYhvNv.tgz
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process
    -Dkotlin.incremental=false
    -Dfile.encoding=UTF-8
    -Xmx4g
    -XX:MaxMetaspaceSize=1536m
    -XX:+UseSerialGC

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct text-only source tree
        run: |
          set -euo pipefail
          mkdir -p src evidence
          if [ -f packs/textsrc-031-ux.tgz.b64 ]; then
            echo Decoding vendored textsrc pack
            base64 -d packs/textsrc-031-ux.tgz.b64 > /tmp/textsrc.tgz
          elif ls packs/textsrc-031-ux.tgz.b64.* >/dev/null 2>&1; then
            echo Decoding split vendored textsrc pack
            cat packs/textsrc-031-ux.tgz.b64.* > /tmp/textsrc.tgz.b64
            base64 -d /tmp/textsrc.tgz.b64 > /tmp/textsrc.tgz
          else
            echo Downloading SHA-pinned textsrc pack
            curl --fail --location --retry 5 --retry-delay 2 -o /tmp/textsrc.tgz "$TEXTSRC_URL"
          fi
          ACTUAL=$(sha256sum /tmp/textsrc.tgz | awk '{print $1}')
          echo "$ACTUAL" | tee evidence/textsrc.sha256
          test "$ACTUAL" = "$EXPECTED_TEXTSRC_SHA256"
          tar -xzf /tmp/textsrc.tgz -C src
          test -f src/gradlew
          test -f src/app/build.gradle.kts
          grep -F 'versionCode = 38' src/app/build.gradle.kts
          grep -F '0.3.1-ux' src/app/build.gradle.kts
          grep -F 'com.nexarenew.drstonecommand' src/app/build.gradle.kts

      - name: Restore wrapper and apply boot-safe icon overlay
        run: |
          set -euo pipefail
          mkdir -p src/gradle/wrapper src/keystore
          curl --fail --location --retry 3 -o src/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          test -s src/gradle/wrapper/gradle-wrapper.jar
          if [ ! -f src/keystore/debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore src/keystore/debug.keystore \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          python3 tools/fix_boot_and_icons.py | tee evidence/overlay.log
          grep -F 'boot-safe icon overlay applied' evidence/overlay.log
          if grep -F 'windowSplashScreenAnimatedIcon' src/app/src/main/res/values-v31/themes.xml; then
            echo splash animated icon still present >&2
            exit 1
          fi
          if grep -F 'android:src=' src/app/src/main/res/drawable/intercept_launch_background.xml; then
            echo launch background still uses bitmap src >&2
            exit 1
          fi
          test -f src/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f src/app/src/main/res/drawable/ic_intercept_foreground.xml
          grep -F 'painterResource(R.drawable.ic_intercept_foreground)' src/app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt
          chmod +x src/gradlew

      - name: Apply stream and bubble overlay
        run: |
          set -euo pipefail
          python3 tools/fix_stream_and_bubbles.py | tee -a evidence/overlay.log
          python3 tools/fix_stream_and_bubbles2.py | tee -a evidence/overlay.log
          python3 tools/fix_stream_and_bubbles3.py | tee -a evidence/overlay.log
          python3 tools/fix_stream_and_bubbles4.py | tee -a evidence/overlay.log
          python3 tools/fix_stream_and_bubbles5.py | tee -a evidence/overlay.log
          python3 tools/fix_ux_upgrade.py | tee -a evidence/overlay.log
          python3 tools/fix_ux_layout.py | tee -a evidence/overlay.log
          python3 tools/fix_token_slider.py | tee -a evidence/overlay.log
          python3 tools/fix_token_limits.py | tee -a evidence/overlay.log
          python3 tools/fix_slider_work.py | tee -a evidence/overlay.log
          python3 tools/fix_slider_native.py | tee -a evidence/overlay.log
          python3 tools/fix_app_token_limit.py | tee -a evidence/overlay.log
          grep -F 'stream-and-bubble overlay applied' evidence/overlay.log
          grep -F 'stream-and-bubble overlay 2 applied' evidence/overlay.log
          grep -F 'stream-and-bubble overlay 3 applied' evidence/overlay.log
          grep -F 'stream-and-bubble overlay 4 applied' evidence/overlay.log
          grep -F 'stream-and-bubble overlay 5 applied' evidence/overlay.log
          grep -F 'ux-upgrade overlay applied' evidence/overlay.log
          grep -F 'ux-layout overlay applied' evidence/overlay.log
          grep -F 'token-slider overlay applied' evidence/overlay.log
          grep -F 'token-limit overlay applied' evidence/overlay.log
          grep -F 'slider-work overlay applied' evidence/overlay.log
          grep -F 'slider-native overlay applied' evidence/overlay.log
          grep -F 'app-token-limit overlay applied' evidence/overlay.log
          grep -F 'fun outputCeiling' src/app/src/main/java/com/nexarenew/aiconsole/domain/OutputTokenPolicy.kt
          grep -F 'Published max output for this model' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          grep -F 'for the whole app' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          grep -F 'fun setAppOutputTokens' src/app/src/main/java/com/nexarenew/aiconsole/ui/AppViewModel.kt
          grep -F 'app_max_output_tokens' src/app/src/main/java/com/nexarenew/aiconsole/settings/AppPreferences.kt
          grep -F 'slidingTokens' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          grep -F 'applyOutputTokens' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          grep -F 'requestDisallowInterceptTouchEvent' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          grep -F 'AndroidView(' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          grep -F 'maxout:' src/app/src/main/java/com/nexarenew/aiconsole/network/ProviderClient.kt
          grep -F 'cappedOutputTokens' src/app/src/main/java/com/nexarenew/aiconsole/data/AppRepository.kt
          if grep -F 'maxTokensText' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt; then
            echo free max-token field still present >&2
            exit 1
          fi
          grep -F 'status != MessageStatus.PENDING' src/app/src/main/java/com/nexarenew/aiconsole/domain/ChatMessageActionPolicy.kt
          grep -F 'INTER_BYTE_MS = 180_000L' src/app/src/main/java/com/nexarenew/aiconsole/domain/StreamIdlePolicy.kt
          grep -F 'fun textualContent' src/app/src/main/java/com/nexarenew/aiconsole/network/ProviderClient.kt
          grep -F 'StreamContinuationPolicy.shouldContinue' src/app/src/main/java/com/nexarenew/aiconsole/data/AppRepository.kt
          grep -F 'fun messageContentFull' src/app/src/main/java/com/nexarenew/aiconsole/data/AppRepository.kt
          grep -F 'FlowRow(' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'CLIPBOARD_SERVICE' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'loadFullContent' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'chat-sticky-actions' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'actionSheetOpen' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'sheet-speak' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'UI_CONTENT_CHARS = 120_000' src/app/src/main/java/com/nexarenew/aiconsole/data/AppRepository.kt
          grep -F 'MAX_CONTINUATIONS = 24' src/app/src/main/java/com/nexarenew/aiconsole/domain/StreamCompletionPolicy.kt
          grep -F 'InterceptDarkColors' src/app/src/main/java/com/nexarenew/aiconsole/ui/theme/InterceptTheme.kt
          grep -F 'full-reader' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'SelectionContainer' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'clipToBounds' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'bubble-open-actions' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'Selected reply' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          grep -F 'publishStreaming(force = true)' src/app/src/main/java/com/nexarenew/aiconsole/ui/AppViewModel.kt
          if grep -F 'Truncated in chat view' src/app/src/main/java/com/nexarenew/aiconsole/data/AppRepository.kt; then
            echo UI truncation banner still present >&2
            exit 1
          fi
          if grep -F 'actions available when complete' src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt; then
            echo bubble actions still locked until complete >&2
            exit 1
          fi
          if grep -F 'Provider stream ended without [DONE]' src/app/src/main/java/com/nexarenew/aiconsole/network/ProviderClient.kt; then
            echo incomplete streams still abort instead of continuing >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Install Android API 36 and Build Tools 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties

      - name: Prepare Gradle
        working-directory: src
        run: |
          set -euo pipefail
          {
            echo org.gradle.daemon=false
            echo org.gradle.parallel=false
            echo org.gradle.workers.max=2
            echo org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseSerialGC -Dfile.encoding=UTF-8
            echo kotlin.compiler.execution.strategy=in-process
            echo kotlin.incremental=false
          } >> gradle.properties
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt

      - name: Assemble debug APK
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug | tee ../evidence/assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../evidence/INTERCEPT_V0_3_1_UX_DEBUG.apk

      - name: Verify package identity
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt"
          if [ ! -x "$AAPT" ]; then AAPT="$BT/aapt2"; fi
          "$AAPT" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='38' versionName='0.3.1-ux'" evidence/aapt-badging.txt
          "$BT/apksigner" verify --verbose "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_1_UX_DEBUG_APK
          path: evidence/INTERCEPT_V0_3_1_UX_DEBUG.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_1_UX_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
