name: INTERCEPT 0.3.1-ux APK

on:
  workflow_dispatch:

env:
  EXPECTED_TEXTSRC_SHA256: 2ce0d2c445f129c96f50f418c3088dc878b2e85dad1ed0c23d74bdef2164ef8e
  TEXTSRC_URL: https://tmpfiles.org/dl/1790771728.b433e23261ba7a80/w8AiALc3ke1h/textsrc-031-ux.tgz
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process
    -Dkotlin.incremental=false
    -Dfile.encoding=UTF-8
    -Xmx4g
    -XX:MaxMetaspaceSize=1536m
    -XX:+UseSerialGC

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct text-only source tree
        run: |
          set -euo pipefail
          mkdir -p src evidence
          echo Downloading SHA-pinned textsrc pack
          curl --fail --location --retry 5 --retry-delay 2 -o /tmp/textsrc.tgz "$TEXTSRC_URL"
          ACTUAL=$(sha256sum /tmp/textsrc.tgz | awk '{print $1}')
          echo "$ACTUAL" | tee evidence/textsrc.sha256
          test "$ACTUAL" = "$EXPECTED_TEXTSRC_SHA256"
          tar -xzf /tmp/textsrc.tgz -C src
          test -f src/gradlew
          test -f src/app/build.gradle.kts
          grep -F 'versionCode = 38' src/app/build.gradle.kts
          grep -F '0.3.1-ux' src/app/build.gradle.kts
          grep -F 'com.nexarenew.drstonecommand' src/app/build.gradle.kts

      - name: Restore Gradle wrapper jar and launcher icons
        run: |
          set -euo pipefail
          mkdir -p src/gradle/wrapper src/keystore
          curl --fail --location --retry 3 -o src/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          test -s src/gradle/wrapper/gradle-wrapper.jar
          if [ ! -f src/keystore/debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore src/keystore/debug.keystore \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          def png(w,h,rgb):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag+data) & 0xffffffff)
              raw = b''.join(bytes([0]) + (bytes(rgb)*w) for _ in range(h))
              sig = bytes([137,80,78,71,13,10,26,10])
              return sig + chunk(b'IHDR', struct.pack('>IIBBBBB', w,h,8,2,0,0,0)) + chunk(b'IDAT', zlib.compress(raw,9)) + chunk(b'IEND', b'')
          root = Path('src/app/src/main/res')
          (root/'drawable-nodpi').mkdir(parents=True, exist_ok=True)
          if not (root/'drawable-nodpi'/'stone_brand_mark.png').exists():
              (root/'drawable-nodpi'/'stone_brand_mark.png').write_bytes(png(192,192,(20,24,32)))
          for name, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              d = root/name
              d.mkdir(parents=True, exist_ok=True)
              if not (d/'ic_launcher.png').exists():
                  (d/'ic_launcher.png').write_bytes(png(size,size,(196,154,74)))
          print('icons ready')
          PY
          chmod +x src/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Install Android API 36 and Build Tools 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties

      - name: Prepare Gradle
        working-directory: src
        run: |
          set -euo pipefail
          {
            echo org.gradle.daemon=false
            echo org.gradle.parallel=false
            echo org.gradle.workers.max=2
            echo org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseSerialGC -Dfile.encoding=UTF-8
            echo kotlin.compiler.execution.strategy=in-process
            echo kotlin.incremental=false
          } >> gradle.properties
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt

      - name: Assemble debug APK
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug | tee ../evidence/assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../evidence/INTERCEPT_V0_3_1_UX_DEBUG.apk

      - name: Verify package identity
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt"
          if [ ! -x "$AAPT" ]; then AAPT="$BT/aapt2"; fi
          "$AAPT" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='38' versionName='0.3.1-ux'" evidence/aapt-badging.txt
          "$BT/apksigner" verify --verbose "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_1_UX_DEBUG_APK
          path: evidence/INTERCEPT_V0_3_1_UX_DEBUG.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_1_UX_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
